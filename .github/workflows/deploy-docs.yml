name: Deploy docs

# Docs ship on their own cadence. The platform's deploy-aws.yml is
# workflow_dispatch-only and cuts a vX.Y.Z release across every service; waiting
# for that to fix a typo is what made splitting this repo out worthwhile.
#
# This builds one image and restarts one container. Nothing else on the box is
# touched — no other service is pulled, no release is tagged, no submodule
# pointer is required for the site to update.
on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/xpectraflow/xpectra-docs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on purpose. `latest` is what the box pulls, so the deploy step
      # needs no edit to /opt/xpectraflow/.env. The short SHA is the rollback
      # handle: set DOCS_IMAGE_TAG to it on the box and restart to pin a known
      # good build without reverting the branch.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

      - name: Restart the docs container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/xpectraflow
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Naming the service is what keeps this from touching anything else.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull xpectra-docs
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d xpectra-docs
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for path in / /concepts /authentication /conventions; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://docs.xpectraflow.com${path}")
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}"; exit 1; }
          done

  # Tell the platform repo which docs commit is now live. This does not deploy
  # anything — the site already updated above — it keeps the submodule pointer
  # honest so each platform release records the docs it shipped alongside.
  bump-pointer:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify the platform repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          repository: xpectraflow/xpectraflow
          event-type: docs-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
